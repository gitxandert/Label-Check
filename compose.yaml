services:
  label-check:
    build:
      context: .
      target: runtime
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION:-ltsc2022}
        MINGW_VERSION: ${MINGW_VERSION:-16.1.0}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.10}
    image: label-check:${IMAGE_TAG:-latest}
    hostname: ${GMSA_HOSTNAME:-label-check}
    user: "NT AUTHORITY\\NETWORK SERVICE"
    credential_spec:
      file: ${GMSA_CREDENTIAL_SPEC:?Set GMSA_CREDENTIAL_SPEC to the host credential-spec filename}
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set ADMIN_DEFAULT_PASSWORD}
      API_REQUIRE_HTTPS: "true"
      API_TRUST_PROXY_HEADERS: "true"
      SCANNER_INVENTORIES: 'D:\scanner_inventories'
      LABEL_CHECK_BATCHES: 'D:\label_check_batches'
      COPATH_CLONE: 'D:\copath_clone'
      INSTANCE_DIR: 'D:\label-check-state\instance'
      SDL_FILE_PATH: 'D:\label-check-state\Slide_Digitization_Log.xlsx'
      BACKUP_DIR: 'D:\label-check-state\csv_backups'
      TQ_TRANSFER_LOG_DIR: 'D:\label_check_batches\transfer_logs'
      HOME: 'C:\labelcheck-profile'
      TQ_HOME_DIR: 'C:\labelcheck-profile\.tq'
      PORT: "5000"
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - type: bind
        source: ${SCANNER_INVENTORIES_HOST:?Set SCANNER_INVENTORIES_HOST}
        target: 'D:\scanner_inventories'
        read_only: true
      - type: bind
        source: ${LABEL_CHECK_BATCHES_HOST:?Set LABEL_CHECK_BATCHES_HOST}
        target: 'D:\label_check_batches'
      - type: bind
        source: ${COPATH_CLONE_HOST:?Set COPATH_CLONE_HOST}
        target: 'D:\copath_clone'
      - type: bind
        source: ${LABEL_CHECK_STATE_HOST:?Set LABEL_CHECK_STATE_HOST}
        target: 'D:\label-check-state'
      - type: bind
        source: ${TQ_HOME_HOST:?Set TQ_HOME_HOST}
        target: 'C:\labelcheck-profile\.tq'
      - type: bind
        source: ${SSH_HOME_HOST:?Set SSH_HOME_HOST}
        target: 'C:\labelcheck-profile\.ssh'
        read_only: true
    restart: unless-stopped
