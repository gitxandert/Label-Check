services:
  label-check:
    platform: linux/amd64
    build:
      context: .
      target: runtime
      args:
        RUST_VERSION: ${RUST_VERSION:-1.95}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: label-check:${IMAGE_TAG:-latest}
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set ADMIN_DEFAULT_PASSWORD}
      API_REQUIRE_HTTPS: "true"
      API_TRUST_PROXY_HEADERS: "true"
      GT450_IMAGES_HOST_PREFIX: ${GT450_IMAGES_HOST_PREFIX:?Set GT450_IMAGES_HOST_PREFIX}
      LABEL_CHECK_BATCHES_HOST_PREFIX: ${LABEL_CHECK_BATCHES_HOST_PREFIX:-D:\label_check_batches}
      COPATH_QUERY_MODE: ${COPATH_QUERY_MODE:-windows_queue}
      COPATH_QUERY_QUEUE: ${COPATH_QUERY_QUEUE:-/data/state/copath-query}
      COPATH_QUERY_TIMEOUT_SECONDS: ${COPATH_QUERY_TIMEOUT_SECONDS:-300}
      PORT: "5000"
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - type: volume
        source: gt450-images
        target: /data/gt450-images
        read_only: true
      - type: bind
        source: ${SCANNER_INVENTORIES_HOST:?Set SCANNER_INVENTORIES_HOST}
        target: /data/scanner-inventories
        read_only: true
      - type: bind
        source: ${LABEL_CHECK_BATCHES_HOST:?Set LABEL_CHECK_BATCHES_HOST}
        target: /data/label-check-batches
      - type: bind
        source: ${COPATH_CLONE_HOST:?Set COPATH_CLONE_HOST}
        target: /data/copath-clone
      - type: bind
        source: ${LABEL_CHECK_STATE_HOST:?Set LABEL_CHECK_STATE_HOST}
        target: /data/state
      - type: bind
        source: ${TQ_HOME_HOST:?Set TQ_HOME_HOST}
        target: /home/labelcheck/.tq
      - type: bind
        source: ${SSH_HOME_HOST:?Set SSH_HOME_HOST}
        target: /home/labelcheck/.ssh
        read_only: true
    restart: unless-stopped

volumes:
  gt450-images:
    name: label-check-gt450-images
    driver: local
    driver_opts:
      type: cifs
      device: "//${GT450_SMB_SERVER:-chp.clarian.org}/app"
      o: "addr=${GT450_SMB_SERVER:-chp.clarian.org},username=${GT450_SMB_USERNAME:?Set GT450_SMB_USERNAME},password=${GT450_SMB_PASSWORD:?Set GT450_SMB_PASSWORD},domain=${GT450_SMB_DOMAIN:?Set GT450_SMB_DOMAIN},vers=${GT450_SMB_VERSION:-3.0},prefixpath=Philips_Slide_Images/GT450_Images,ro,uid=10001,gid=10001,file_mode=0444,dir_mode=0555"
